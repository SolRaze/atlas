<!doctype html>
<!-- GENERATED by bin/atlas-build. Do not hand-edit.
     Edit templates/sections/*.html + sections.manifest, then regenerate. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0e10">
<!-- iOS: "Add to Home Screen" opens this standalone, not in Safari chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="atlas">
<!-- assets sit next to the page (atlas-build --push copies them).
     -v2 names exist to break iOS's very sticky touch-icon cache. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<title>atlas</title>
<style>
{{STYLE}}
</style>
</head>
<body>
<div class="app">

<nav class="rail" id="rail" aria-label="tabs"></nav>

<div class="main" id="main">
  <div class="view atlas on" id="view-atlas">
    <div class="wrap">
    <header>
      <div class="bar">
        <h1>atlas</h1>
        <span class="corner">
          <button class="hbtn" id="prefBtn" title="what this device shows">prefs</button>
          <button class="hbtn" id="reloadBtn" title="reload atlas">reload</button>
        </span>
        <p class="sub">machine map · {{DATE}}</p>
        <div class="search">
          <input id="q" type="search" placeholder="search everything" autocomplete="off" spellcheck="false">
          <span class="hint">/</span>
        </div>

      </div>
      <nav id="nav">
{{NAV}}
      </nav>
    </header>

    <div class="tiles-head">
      <h2>tiles</h2>
      <button class="hbtn" id="tileEdit">edit</button>
    </div>
    <div class="tiles" id="tiles"></div>

{{SECTIONS}}

    <p class="empty" id="empty">no match.</p>

    <footer>
      <span>rebuild <kbd>bin/atlas-build --push</kbd></span>
      <span>search <kbd>/</kbd> · sections <kbd>1</kbd>–<kbd>{{NSEC}}</kbd> · clear <kbd>esc</kbd></span>
    </footer>
    </div>
  </div>
</div>
</div>

<div class="modal" id="tileModal">
  <div class="modal-card">
    <h3><span>tile</span><button id="tileClose" aria-label="close">✕</button></h3>
    <p class="lede" id="tileHint">Tiles live on this page and open in a tab, like the rail.</p>
    <div class="row"><label for="tLabel">label</label>
      <input id="tLabel" placeholder="grafana" autocomplete="off"></div>
    <div class="row"><label for="tUrl">url</label>
      <input id="tUrl" placeholder="https://…" autocomplete="off" inputmode="url" spellcheck="false"></div>
    <div class="row"><label for="tGlyph">icon</label>
      <input id="tGlyph" placeholder="letter, symbol or emoji" maxlength="3" autocomplete="off"></div>
    <div class="row"><label for="tNote">note</label>
      <input id="tNote" placeholder="optional subtitle" autocomplete="off"></div>
    <div class="act">
      <button id="tSave">save</button>
      <button id="tDelete">delete</button>
      <button id="tPin">also pin to rail</button>
    </div>
  </div>
</div>

<div class="modal" id="prefModal">
  <div class="modal-card">
    <h3><span>prefs</span><button id="prefClose" aria-label="close">✕</button></h3>
    <p class="lede" id="prefLede">Kept on this device only. A switch on means shown.</p>
    <div id="prefBody"></div>
    <div class="act"><button id="prefReset">show everything</button></div>
  </div>
</div>

<div class="modal" id="pinModal">
  <div class="modal-card">
    <h3><span>tabs</span><button id="pinClose" aria-label="close">✕</button></h3>
    <div class="tabs">
      <button data-pane="paneLinks" class="on">from this page</button>
      <button data-pane="paneCustom">custom</button>
      <button data-pane="paneManage">pinned</button>
    </div>

    <div class="pane on" id="paneLinks"></div>

    <div class="pane" id="paneCustom">
      <div class="row"><label for="pinLabel">label</label>
        <input id="pinLabel" placeholder="printer" autocomplete="off"></div>
      <div class="row"><label for="pinUrl">url</label>
        <input id="pinUrl" placeholder="https://printer.lan" autocomplete="off"
               inputmode="url" spellcheck="false"></div>
      <div class="row"><label for="pinGlyph">icon</label>
        <input id="pinGlyph" placeholder="letter, symbol or emoji" maxlength="3"
               autocomplete="off"></div>
      <div class="row"><label>preview</label>
        <div class="rail-btn" id="pinPreview" style="cursor:default">
          <span class="glyph">?</span><span class="cap">label</span>
        </div></div>
      <div class="act"><button id="pinSave">add tab</button></div>
    </div>

    <div class="pane" id="paneManage"></div>
  </div>
</div>

<script>
{{SCRIPT}}
</script>
</body>
</html>
