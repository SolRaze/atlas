# The page plus the Mac kit. Mounted over nginx's default.conf by mac/compose.yml.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    root /usr/share/nginx/html;
    # behind tailscale serve or a proxy, $scheme here is http: a redirect
    # with a host in it would send an https client to http
    absolute_redirect off;

    location / { try_files $uri $uri/ =404; }

    # noVNC and the kit's script change on update; never serve a stale copy
    location /mac/ { add_header Cache-Control no-store; }

    # the viewer's websocket: noVNC -> websockify in `novnc`. The upstream is
    # a variable so nginx starts while `novnc` is still down.
    location = /vnc/vnc {
        resolver 127.0.0.11 valid=30s;
        set $novnc_up novnc;
        rewrite ^ /vnc break;
        proxy_pass http://$novnc_up:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
